<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Nghe thử 顺便</title>
<style>body{font:16px system-ui;max-width:640px;margin:20px auto;padding:0 16px}button{font-size:16px;padding:8px 14px;margin:4px;border-radius:8px;border:1px solid #888;background:#fff}</style>
<h2>Yunxi - các cách đọc 顺便</h2><div id=r></div>
<script>
var L=[['a','顺便 (giữ nguyên)'],['b','顺变 (chữ đồng âm)'],['c','顺便。(có dấu chấm)'],['d','Cả câu (giữ nguyên)'],['e','Cả câu (顺变)']];var h='';
[15,5].forEach(function(r){h+='<h3>Tốc độ chậm hơn '+r+'%</h3>';L.forEach(function(x){h+='<button onclick="new Audio(\'demo/sb_'+x[0]+r+'.mp3\').play()">▶ '+x[1]+'</button>';});});
document.getElementById('r').innerHTML=h;
</script>
