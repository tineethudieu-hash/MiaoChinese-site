<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tạo giọng đọc ElevenLabs</title>
<style>
body{font-family:-apple-system,'Be Vietnam Pro',sans-serif;background:#FBF3E1;color:#15130F;margin:0;padding:24px;}
.card{max-width:560px;margin:30px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 6px 22px rgba(21,19,15,.12);border-top:6px solid #CB9A2E;}
h1{font-size:1.3rem;margin:0 0 6px} p{color:#5B5547;line-height:1.55;font-size:.95rem}
input[type=password],input[type=text]{width:100%;padding:12px;border:1.5px solid #E6E1D3;border-radius:10px;font-size:1rem;box-sizing:border-box}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:10px;background:#15130F;color:#F6E6BC;font-size:1rem;font-weight:700}
button:disabled{opacity:.5}
.bar{height:14px;background:#eee;border-radius:99px;overflow:hidden;margin-top:16px}.bar i{display:block;height:100%;width:0;background:#CB9A2E;transition:.3s}
#log{margin-top:12px;font-size:.88rem;white-space:pre-wrap;line-height:1.5}
.err{color:#7A2E2E;font-weight:700}.ok{color:#2E5339;font-weight:700}
label{font-size:.85rem;color:#5B5547;display:block;margin-top:10px}
</style></head><body>
<div class="card">
<h1>🎙️ Tạo giọng đọc ElevenLabs cho toàn bộ bài</h1>
<p>Bấm một lần để tạo giọng ElevenLabs cho các âm chưa có (cả bài mới thêm) và lưu vĩnh viễn vào web. Có thể dừng và bấm lại bất kỳ lúc nào, phần đã làm sẽ được bỏ qua.</p>
<input id="pin" type="password" inputmode="numeric" placeholder="Nhập PIN giáo viên">
<label><input id="reset" type="checkbox"> Tạo lại TẤT CẢ (chỉ khi đổi giọng khác)</label>
<button id="go">▶️ Bắt đầu tạo</button>
<div class="bar"><i id="fill"></i></div>
<div id="log"></div>
</div>
<script>
var go=document.getElementById('go'),log=document.getElementById('log'),fill=document.getElementById('fill');
function say(t,c){log.innerHTML='<span class="'+(c||'')+'">'+t+'</span>';}
go.onclick=async function(){
  var pin=document.getElementById('pin').value.trim(); if(!pin){say('Hãy nhập PIN','err');return;}
  var reset=document.getElementById('reset').checked; go.disabled=true; var first=true;
  try{
    for(var n=0;n<80;n++){
      say('Đang tạo… (lượt '+(n+1)+')');
      var r=await fetch('/api/warm?pin='+encodeURIComponent(pin)+(reset&&first?'&reset=1':''),{method:'POST'});
      first=false; var j=await r.json();
      if(!r.ok){say('Lỗi: '+(j.error||r.status),'err');go.disabled=false;return;}
      fill.style.width=Math.round(100*j.done/j.total)+'%';
      if(!j.remaining){say('✅ Xong! '+j.done+'/'+j.total+' âm đã dùng giọng ElevenLabs. Đợi khoảng 1–2 phút để web cập nhật rồi tải lại trang bài học.','ok');go.disabled=false;return;}
      say('Đã làm '+j.done+'/'+j.total+'…');
      await new Promise(s=>setTimeout(s,1500));
    }
  }catch(e){say('Lỗi mạng: '+e.message+' — bấm lại để tiếp tục.','err');}
  go.disabled=false;
};
</script></body></html>
